name: Release APK and OEM ZIP
on:
  push:
    tags: ['v*']
permissions:
  contents: write
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Validate release version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: '[[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+(\.[0-9]+)?$ ]]'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Run unit tests
        run: ./gradlew :app:testDebugUnitTest :diagnostics:testDebugUnitTest --no-daemon --no-configuration-cache --console=plain
      - name: Run native transport tests
        run: |
          cmake -S diagnostics/src/main/cpp -B /tmp/cabin-native-tests
          cmake --build /tmp/cabin-native-tests
          ctest --test-dir /tmp/cabin-native-tests --output-on-failure
      - name: Save test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cabin-test-reports
          path: |
            app/build/reports/tests/
            diagnostics/build/reports/tests/
      - name: Build signed APK
        env:
          CABIN_SENTRY_DSN: ${{ secrets.CABIN_SENTRY_DSN }}
          KEYSTORE_BASE64: ${{ secrets.CABIN_KEYSTORE_BASE64 }}
          CABIN_KEYSTORE_PASSWORD: ${{ secrets.CABIN_KEYSTORE_PASSWORD }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          test -n "$KEYSTORE_BASE64"
          test -n "$CABIN_KEYSTORE_PASSWORD"
          export CABIN_KEYSTORE_PATH="$RUNNER_TEMP/cabin-release.jks"
          trap 'rm -f "$CABIN_KEYSTORE_PATH"' EXIT
          printf '%s' "$KEYSTORE_BASE64" | base64 --decode > "$CABIN_KEYSTORE_PATH"
          chmod 600 "$CABIN_KEYSTORE_PATH"
          export CABIN_VERSION_NAME="${RELEASE_TAG#v}"
          export CABIN_VERSION_CODE="$(python3 tools/ci_version_code.py)"
          export CABIN_SENTRY_MAPPING_UUID="$(python3 -c 'import uuid; print(uuid.uuid4())')"
          printf '%s' "$CABIN_SENTRY_MAPPING_UUID" > sentry-mapping-uuid.txt
          chmod +x gradlew
          ./gradlew :app:assembleRelease --no-daemon --no-configuration-cache --console=plain
          cp app/build/outputs/apk/release/app-release.apk cabin.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify cabin.apk
          sha256sum cabin.apk > cabin.apk.sha256
          python3 - <<'PYMETA'
          import hashlib, json, os
          from pathlib import Path
          apk = Path('cabin.apk')
          Path('update.json').write_text(json.dumps(dict(packageName='zeno.carlink',
              versionName=os.environ['CABIN_VERSION_NAME'], versionCode=int(os.environ['CABIN_VERSION_CODE']),
              size=apk.stat().st_size, sha256=hashlib.sha256(apk.read_bytes()).hexdigest())))
          PYMETA
      - name: Package additive OEM integration ZIP
        run: |
          set -euo pipefail
          python3 tools/privapp/build_oem_bundle.py --apk cabin.apk --output cabin-oem-integration.zip
          sha256sum cabin-oem-integration.zip > cabin-oem-integration.zip.sha256
      - name: Save release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: cabin-release
          if-no-files-found: error
          path: |
            cabin.apk
            cabin.apk.sha256
            update.json
            app/build/outputs/mapping/release/mapping.txt
            sentry-mapping-uuid.txt
            cabin-oem-integration.zip
            cabin-oem-integration.zip.sha256
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          flags=(--prerelease=false --latest)
          notes=(--notes 'Signed Cabin APK and additive OEM integration ZIP. Android 8.1+. Vehicle support depends on firmware and CAN profile.')
          notes_file="documents/releases/${RELEASE_TAG#v}.md"
          if [[ -f "$notes_file" ]]; then notes=(--notes-file "$notes_file"); fi
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" cabin.apk cabin.apk.sha256 update.json cabin-oem-integration.zip cabin-oem-integration.zip.sha256 --clobber
            gh release edit "$RELEASE_TAG" "${flags[@]}" "${notes[@]}"
          else
            gh release create "$RELEASE_TAG" cabin.apk cabin.apk.sha256 update.json cabin-oem-integration.zip cabin-oem-integration.zip.sha256 \
              --verify-tag --title "Cabin ${RELEASE_TAG#v}" "${flags[@]}" \
              "${notes[@]}"
          fi
