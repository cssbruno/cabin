name: Build FYT Debug USB ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify FYT router binaries
        run: |
          set -euo pipefail
          test -s tools/privapp/fyt-router-binaries/lsec6315update
          test -s tools/privapp/fyt-router-binaries/lsec6316update
          test -s tools/privapp/fyt-router-binaries/lsec6521update
      - name: Build debug APK
        env:
          DEBUG_KEYSTORE_BASE64: ${{ secrets.CABIN_DEBUG_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [[ -z "$DEBUG_KEYSTORE_BASE64" ]]; then
            echo "::error::Set CABIN_DEBUG_KEYSTORE_BASE64 to the working local debug.keystore. Refusing to generate a different signer."
            exit 1
          fi
          export CABIN_DEBUG_KEYSTORE_PATH="$RUNNER_TEMP/cabin-debug.keystore"
          printf '%s' "$DEBUG_KEYSTORE_BASE64" | base64 --decode > "$CABIN_DEBUG_KEYSTORE_PATH"
          chmod 600 "$CABIN_DEBUG_KEYSTORE_PATH"
          trap 'rm -f "$CABIN_DEBUG_KEYSTORE_PATH"' EXIT
          export CABIN_VERSION_NAME="debug-${GITHUB_RUN_NUMBER}"
          export CABIN_VERSION_CODE="$(python3 tools/ci_version_code.py)"
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --no-configuration-cache --console=plain
          cp app/build/outputs/apk/debug/app-debug.apk cabin-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs cabin-debug.apk
          expected=$(keytool -exportcert -keystore "$CABIN_DEBUG_KEYSTORE_PATH" -alias androiddebugkey -storepass android | sha256sum | cut -d ' ' -f 1)
          actual=$("$ANDROID_HOME/build-tools/36.0.0/apksigner" verify --print-certs cabin-debug.apk | awk '/certificate SHA-256 digest:/ {print $NF; exit}')
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::APK signer differs from the configured debug key. Refusing to publish."
            exit 1
          fi
      - name: Build FYT debug USB ZIP
        run: |
          set -euo pipefail
          python3 tools/privapp/build_fyt_debug_bundle.py \
            --apk cabin-debug.apk \
            --updater-source tools/privapp/fyt-router-binaries \
            --output cabin-fyt-debug.zip
          sha256sum cabin-debug.apk cabin-fyt-debug.zip > SHA256SUMS
          unzip -t cabin-fyt-debug.zip
      - uses: actions/upload-artifact@v4
        with:
          name: cabin-fyt-debug
          if-no-files-found: error
          path: |
            cabin-debug.apk
            cabin-fyt-debug.zip
            SHA256SUMS
