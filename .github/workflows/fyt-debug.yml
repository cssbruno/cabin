name: Build FYT Debug USB ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Verify FYT router binaries
        run: |
          set -euo pipefail
          test -s tools/privapp/fyt-router-binaries/lsec6315update
          test -s tools/privapp/fyt-router-binaries/lsec6316update
          test -s tools/privapp/fyt-router-binaries/lsec6521update
      - name: Build debug APK
        run: |
          set -euo pipefail
          export CABIN_VERSION_NAME="debug-${GITHUB_RUN_NUMBER}"
          export CABIN_VERSION_CODE="$((1000000 + GITHUB_RUN_NUMBER))"
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --no-configuration-cache --console=plain
          cp app/build/outputs/apk/debug/app-debug.apk cabin-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify cabin-debug.apk
      - name: Build FYT debug USB ZIP
        run: |
          set -euo pipefail
          python3 tools/privapp/build_fyt_debug_bundle.py \
            --apk cabin-debug.apk \
            --updater-source tools/privapp/fyt-router-binaries \
            --output cabin-fyt-debug.zip
          sha256sum cabin-debug.apk cabin-fyt-debug.zip > SHA256SUMS
          unzip -t cabin-fyt-debug.zip
      - uses: actions/upload-artifact@v4
        with:
          name: cabin-fyt-debug
          if-no-files-found: error
          path: |
            cabin-debug.apk
            cabin-fyt-debug.zip
            SHA256SUMS
