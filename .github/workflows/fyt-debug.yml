name: Build FYT Debug USB ZIP

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Restore vendor FYT router binaries
        env:
          FYT_UPDATER_BINARIES_BASE64: ${{ secrets.FYT_UPDATER_BINARIES_BASE64 }}
        run: |
          set -euo pipefail
          test -n "$FYT_UPDATER_BINARIES_BASE64" || {
            echo 'Configure FYT_UPDATER_BINARIES_BASE64 with a base64-encoded vendor FYT update ZIP.' >&2
            exit 1
          }
          printf '%s' "$FYT_UPDATER_BINARIES_BASE64" | base64 --decode > "$RUNNER_TEMP/fyt-updaters.zip"
          unzip -t "$RUNNER_TEMP/fyt-updaters.zip" >/dev/null
      - name: Build debug APK
        env:
          CABIN_VERSION_NAME: debug-${{ github.run_number }}
          CABIN_VERSION_CODE: ${{ github.run_number }}
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:assembleDebug --no-daemon --no-configuration-cache --console=plain
          cp app/build/outputs/apk/debug/app-debug.apk cabin-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/apksigner" verify cabin-debug.apk
      - name: Build FYT debug USB ZIP
        run: |
          set -euo pipefail
          python3 tools/privapp/build_fyt_debug_bundle.py \
            --apk cabin-debug.apk \
            --updater-archive "$RUNNER_TEMP/fyt-updaters.zip" \
            --output cabin-fyt-debug.zip
          sha256sum cabin-debug.apk cabin-fyt-debug.zip > SHA256SUMS
          unzip -t cabin-fyt-debug.zip
      - uses: actions/upload-artifact@v4
        with:
          name: cabin-fyt-debug
          if-no-files-found: error
          path: |
            cabin-debug.apk
            cabin-fyt-debug.zip
            SHA256SUMS
