name: Validate Honda Customizer release

on:
  push:
    branches: [main]
    paths:
      - 'honda-customizer/**'
      - '.github/workflows/honda-customizer.yml'
  pull_request:
    paths:
      - 'honda-customizer/**'
      - '.github/workflows/honda-customizer.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: honda-customizer-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - api: 17
            target: default
            arch: x86
          - api: 35
            target: google_apis
            arch: x86_64
    defaults:
      run:
        working-directory: honda-customizer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - name: Install compile SDK and build tools
        run: sdkmanager 'platforms;android-36' 'build-tools;36.0.0'
      - name: Validate smoke-result parser
        run: python3 -m unittest discover -s tools -p 'test_*.py' -v
      - name: Test, lint and build release plus instrumentation APKs
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew :app:testReleaseUnitTest :app:lintRelease :app:assembleRelease :app:assembleReleaseAndroidTest --no-daemon --console=plain
      # Follow the emulator-runner's documented Ubuntu KVM setup.
      # https://github.com/ReactiveCircus/android-emulator-runner#running-hardware-accelerated-emulators-on-linux-runners
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Smoke-test release APK on API ${{ matrix.api }}
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: ${{ matrix.arch }}
          emulator-port: 5554
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none -skin 800x480
          disable-animations: true
          working-directory: honda-customizer
          script: python3 tools/run_emulator_smoke.py --serial emulator-5554
      - name: Explain validation APK signing
        if: always()
        run: |
          echo '### Honda Customizer validation artifacts' >> "$GITHUB_STEP_SUMMARY"
          echo 'These CI APKs use the runner-generated development certificate for emulator validation. They are not update-compatible distribution builds and are not published as a release.' >> "$GITHUB_STEP_SUMMARY"
      - name: Upload test, lint and emulator reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: honda-customizer-reports-api${{ matrix.api }}-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            honda-customizer/app/build/reports/**
            honda-customizer/app/build/test-results/**
      - name: Upload CI validation APKs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: honda-customizer-ci-only-apks-api${{ matrix.api }}-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            honda-customizer/app/build/outputs/apk/release/*.apk
            honda-customizer/app/build/outputs/apk/androidTest/release/*.apk
